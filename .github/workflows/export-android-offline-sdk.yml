name: Export Android toolchain for private local APK build

on:
  push:
    branches:
      - android-offline-toolchain-20261103

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -name sdkmanager -type f -print
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -name sdkmanager -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: Install Android platform and build tools
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;34.0.0" "platform-tools"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prime Android Gradle plugin 8.7.3 and Kotlin 2.0.21
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/prime-android/app/src/main/java/test/offline
          cd /tmp/prime-android
          cat > settings.gradle.kts <<'GRADLEEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "OfflineToolchain"
          include(":app")
          GRADLEEOF
          cat > build.gradle.kts <<'GRADLEEOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          GRADLEEOF
          cat > app/build.gradle.kts <<'GRADLEEOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "test.offline"
              compileSdk = 35
              defaultConfig { applicationId = "test.offline"; minSdk = 30; targetSdk = 34 }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              testImplementation("junit:junit:4.13.2")
              testImplementation("org.robolectric:robolectric:4.14.1")
          }
          GRADLEEOF
          cat > app/src/main/AndroidManifest.xml <<'MANIFESTEOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Test"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          MANIFESTEOF
          cat > app/src/main/java/test/offline/MainActivity.kt <<'KOTLINEOF'
          package test.offline
          import android.app.Activity
          class MainActivity : Activity()
          KOTLINEOF
          gradle --no-daemon --max-workers=2 :app:assembleDebug --stacktrace
          gradle --no-daemon :app:dependencies --configuration debugUnitTestRuntimeClasspath > /tmp/gradle-resolved-deps.txt
          echo "ANDROID_HOME=$ANDROID_HOME"
          which gradle
          readlink -f "$(which gradle)"
      - name: Create offline tar archives
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/offline"
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_DIR="$(dirname "$(dirname "$GRADLE_BIN")")"
          tar -czf "$RUNNER_TEMP/offline/gradle-8.9.tar.gz" -C "$(dirname "$GRADLE_DIR")" "$(basename "$GRADLE_DIR")"
          tar -czf "$RUNNER_TEMP/offline/android-sdk-35-buildtools34.tar.gz" -C "$ANDROID_HOME" platforms/android-35 build-tools/34.0.0 platform-tools licenses
          tar -czf "$RUNNER_TEMP/offline/gradle-caches.tar.gz" -C "$HOME" .gradle/caches .gradle/wrapper || tar -czf "$RUNNER_TEMP/offline/gradle-caches.tar.gz" -C "$HOME" .gradle/caches
          ls -lah "$RUNNER_TEMP/offline"
      - name: Upload Gradle
        uses: actions/upload-artifact@v4
        with:
          name: offline-gradle89
          path: ${{ runner.temp }}/offline/gradle-8.9.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: offline-android-sdk35
          path: ${{ runner.temp }}/offline/android-sdk-35-buildtools34.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Upload Gradle caches
        uses: actions/upload-artifact@v4
        with:
          name: offline-gradle-cache87-kotlin20
          path: ${{ runner.temp }}/offline/gradle-caches.tar.gz
          compression-level: 0
          retention-days: 1
