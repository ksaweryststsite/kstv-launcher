name: Temporary Chmielnik 1918 scan fetch

on:
  push:
    branches:
      - tmp/chmielnik-1918-scan-fetch-20260819
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-chmielnik-1918-scan-fetch
  cancel-in-progress: true

jobs:
  fetch-scans:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Install parser dependencies
        run: python3 -m pip install --quiet beautifulsoup4 pillow
      - name: Resolve album links and download all 52 public scans
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scans diagnostics
          mkdir -p scans diagnostics
          python3 - <<'PY'
          from __future__ import annotations
          import io, pathlib, re, time
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          ALBUM = 'https://metryki.genbaza.pl/genbaza,list,391780,1'
          OUT = pathlib.Path('scans')
          DIAG = pathlib.Path('diagnostics')
          expected = [f'_{i:03d}_index.JPG' for i in range(1, 5)] + [f'_{i:03d}_ur.JPG' for i in range(5, 53)]
          expected_lc = {x.lower(): x for x in expected}

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Accept-Language': 'pl-PL,pl;q=0.9,en;q=0.7',
          })

          def get(url: str, *, referer: str | None = None):
              headers = {'Referer': referer} if referer else {}
              last = None
              for attempt in range(6):
                  try:
                      r = session.get(url, headers=headers, timeout=(15, 90), allow_redirects=True)
                      last = (r.status_code, r.headers.get('content-type',''), len(r.content), r.url)
                      if r.status_code == 200:
                          return r
                      if r.status_code in (403, 429, 500, 502, 503, 504):
                          time.sleep(min(30, 3 * (attempt + 1)))
                          continue
                      return r
                  except Exception as exc:
                      last = repr(exc)
                      time.sleep(min(30, 3 * (attempt + 1)))
              raise RuntimeError(f'GET failed {url}: {last}')

          def allow_display(detail_url: str, name: str):
              endpoint = 'https://metryki.genbaza.pl/photo/allow-display'
              headers = {
                  'Referer': detail_url,
                  'X-Requested-With': 'XMLHttpRequest',
                  'Accept': 'application/json, text/javascript, */*; q=0.01',
              }
              last = None
              for attempt in range(6):
                  try:
                      r = session.post(endpoint, data={'directory_id': '391780', 'fileName': name}, headers=headers, timeout=(15, 60))
                      last = (r.status_code, r.text[:200])
                      if r.status_code == 200 and r.text.strip().lower() in ('true', '1', '"true"'):
                          return True, last
                      if r.status_code in (403, 429, 500, 502, 503, 504):
                          time.sleep(min(30, 3 * (attempt + 1)))
                          continue
                      return False, last
                  except Exception as exc:
                      last = repr(exc)
                      time.sleep(min(30, 3 * (attempt + 1)))
              return False, last

          album = get(ALBUM)
          DIAG.joinpath('album.html').write_bytes(album.content)
          soup = BeautifulSoup(album.text, 'html.parser')
          detail_by_name: dict[str, str] = {}
          for a in soup.find_all('a', href=True):
              label = a.get_text(' ', strip=True)
              key = label.lower()
              if key in expected_lc:
                  detail_by_name[expected_lc[key]] = urljoin(ALBUM, a['href'])
          if len(detail_by_name) < 52:
              for name in expected:
                  if name in detail_by_name:
                      continue
                  pat = re.compile(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>\s*' + re.escape(name) + r'\s*</a>', re.I)
                  m = pat.search(album.text)
                  if m:
                      detail_by_name[name] = urljoin(ALBUM, m.group(1))

          DIAG.joinpath('resolved_detail_links.tsv').write_text(
              '\n'.join(f'{n}\t{detail_by_name.get(n, "")}' for n in expected) + '\n', encoding='utf-8')
          print(f'Resolved {len(detail_by_name)}/52 detail links')

          rows = []
          for pos, name in enumerate(expected, 1):
              detail_url = detail_by_name.get(name)
              if not detail_url:
                  rows.append((name, 'FAIL_NO_DETAIL', 0, 0, 0, '', '', ''))
                  print(f'[{pos:02d}/52] FAIL_NO_DETAIL {name}')
                  continue
              try:
                  detail = get(detail_url, referer=ALBUM)
                  if pos <= 4:
                      DIAG.joinpath(f'detail_{pos:03d}.html').write_bytes(detail.content)
                  dsoup = BeautifulSoup(detail.text, 'html.parser')
                  candidates = []
                  for tag in dsoup.find_all(True):
                      for attr in ('href', 'src'):
                          val = tag.get(attr)
                          if val and '/photo/' in val and '/photo/request-link' not in val and '/photo/download' not in val and '/photo/allow-display' not in val:
                              candidates.append(urljoin(detail.url, val))
                  for val in re.findall(r'(?:https?:)?//[^\s"\'<>]+/photo/[^\s"\'<>]+', detail.text, flags=re.I):
                      if any(x in val for x in ('/photo/request-link', '/photo/download', '/photo/allow-display')):
                          continue
                      candidates.append(('https:' + val) if val.startswith('//') else val)
                  candidates = list(dict.fromkeys(candidates))
                  image_url = next((u for u in candidates if name.lower() in u.lower()), candidates[0] if candidates else '')
                  if not image_url:
                      rows.append((name, 'FAIL_NO_IMAGE_URL', 0, 0, 0, detail_url, '', ''))
                      print(f'[{pos:02d}/52] FAIL_NO_IMAGE_URL {name}')
                      continue

                  allowed, allow_info = allow_display(detail_url, name)
                  if not allowed:
                      rows.append((name, 'FAIL_ALLOW_DISPLAY', 0, 0, 0, detail_url, image_url, repr(allow_info)))
                      print(f'[{pos:02d}/52] FAIL_ALLOW_DISPLAY {name}: {allow_info!r}')
                      continue
                  image = get(image_url, referer=detail_url)
                  data = image.content
                  width = height = 0
                  valid = False
                  try:
                      with Image.open(io.BytesIO(data)) as im:
                          width, height = im.size
                          valid = width >= 1200 and height >= 1200
                  except Exception:
                      valid = False
                  if not valid:
                      rows.append((name, 'FAIL_BAD_IMAGE', len(data), width, height, detail_url, image_url, repr(allow_info)))
                      print(f'[{pos:02d}/52] FAIL_BAD_IMAGE {name} {len(data)} {width}x{height}')
                      continue
                  OUT.joinpath(name).write_bytes(data)
                  rows.append((name, 'OK', len(data), width, height, detail_url, image_url, repr(allow_info)))
                  print(f'[{pos:02d}/52] OK {name} {len(data)} {width}x{height}')
                  time.sleep(0.6)
              except Exception as exc:
                  rows.append((name, 'FAIL_EXCEPTION', 0, 0, 0, detail_url, '', repr(exc)))
                  print(f'[{pos:02d}/52] FAIL_EXCEPTION {name}: {exc!r}')

          manifest = '\n'.join('\t'.join(map(str, row)) for row in rows) + '\n'
          OUT.joinpath('manifest.tsv').write_text(manifest, encoding='utf-8')
          ok = sum(row[1] == 'OK' for row in rows)
          OUT.joinpath('summary.txt').write_text(f'{ok}/52\n', encoding='utf-8')
          print(f'Downloaded and validated {ok}/52 scans')
          PY
      - name: Upload scans and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: chmielnik-1918-birth-scans
          path: |
            scans/
            diagnostics/
          if-no-files-found: error
          retention-days: 1
      - name: Publish temporary run metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          mkdir -p .tmp_chmielnik_fetch_results
          printf '%s\n' "${GITHUB_RUN_ID}" > .tmp_chmielnik_fetch_results/run_id.txt
          cp scans/manifest.tsv .tmp_chmielnik_fetch_results/manifest.tsv || true
          cp scans/summary.txt .tmp_chmielnik_fetch_results/summary.txt || true
          cp diagnostics/resolved_detail_links.tsv .tmp_chmielnik_fetch_results/resolved_detail_links.tsv || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp_chmielnik_fetch_results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Temporary scan fetch results [skip ci]'
          git push origin HEAD:"${TARGET_BRANCH}"
