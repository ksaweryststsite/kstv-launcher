name: Temporary Chmielnik 1918 scan fetch

on:
  push:
    branches:
      - tmp/chmielnik-1918-scan-fetch-20260819
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-scans:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Download 52 public scan images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scans
          python3 - <<'PY'
          import pathlib, time, requests

          out = pathlib.Path('scans')
          names = [f'_{i:03d}_index.JPG' for i in range(1, 5)] + [f'_{i:03d}_ur.JPG' for i in range(5, 53)]
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Referer': 'https://metryki.genbaza.pl/genbaza,list,391780,1',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
          })
          manifest = []
          for idx, name in enumerate(names, 1):
              url = f'https://metryki.genbaza.pl/photo/202604/391780/{name}'
              last = None
              for attempt in range(4):
                  try:
                      r = session.get(url, timeout=60)
                      last = (r.status_code, r.headers.get('content-type',''), len(r.content))
                      if r.status_code == 200 and len(r.content) > 10000 and r.content[:2] == b'\xff\xd8':
                          (out / name).write_bytes(r.content)
                          manifest.append(f'{name}\tOK\t{len(r.content)}\t{url}')
                          print(f'[{idx:02d}/52] OK {name} {len(r.content)} bytes')
                          break
                  except Exception as e:
                      last = repr(e)
                  time.sleep(2 + attempt * 2)
              else:
                  manifest.append(f'{name}\tFAIL\t{last}\t{url}')
                  print(f'[{idx:02d}/52] FAIL {name}: {last}')
              time.sleep(0.4)
          (out / 'manifest.tsv').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          ok = sum('\tOK\t' in x for x in manifest)
          print(f'Downloaded {ok}/52 images')
          if ok == 0:
              raise SystemExit('No images downloaded')
          PY
      - name: Upload scans
        uses: actions/upload-artifact@v4
        with:
          name: chmielnik-1918-birth-scans
          path: scans/
          if-no-files-found: error
          retention-days: 1
      - name: Publish temporary run metadata
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          mkdir -p .tmp_chmielnik_fetch_results
          printf '%s\n' "${GITHUB_RUN_ID}" > .tmp_chmielnik_fetch_results/run_id.txt
          cp scans/manifest.tsv .tmp_chmielnik_fetch_results/manifest.tsv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp_chmielnik_fetch_results
          git commit -m 'Temporary scan fetch results [skip ci]'
          git push origin HEAD:"${TARGET_BRANCH}"
